[mypy]
python_version = 3.12
follow_imports = silent
disable_error_code = import-untyped

# Read the installed policy signatures. Do not report third-party errors.
[mypy-lerobot.*]
follow_untyped_imports = True
ignore_errors = True

[mypy-diffusers.*]
follow_imports = skip

[mypy-transformers.*]
follow_imports = skip

[mypy-torchvision.*]
follow_imports = skip

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vla-lab"
version = "0.1.0"
description = "A simulation course for robot learning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,training,smolvla,diffusion] @ git+https://github.com/huggingface/lerobot.git@e0d50211ef236143ae867228662b7dfaba554f02",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchcodec==0.11.0",
  "typer>=0.16,<1",
  "jupyterlab>=4.4,<5",
  "nbclient>=0.10,<1",
  "matplotlib>=3.10,<4",
  "pyyaml>=6,<7",
  "ipywidgets>=8.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
robot-lab = "vla_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_lab"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
